name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: python -m pip install -r server/requirements.txt
      - run: python -m pytest -q

  android:
    name: Android tests and debug build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x android/gradlew
      - run: ./android/gradlew --no-daemon -p android testDebugUnitTest assembleDebug

  dashboard:
    name: Dashboard JavaScript syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -c "import re,pathlib; s=pathlib.Path('server/static/index.html').read_text(); m=re.search(r'<script>(.*?)</script>',s,re.S); assert m, 'inline script missing'; pathlib.Path('/tmp/dashboard.js').write_text(m.group(1))"
      - run: node --check /tmp/dashboard.js
