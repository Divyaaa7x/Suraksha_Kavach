name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: python -m pip install -r server/requirements.txt
      - run: python -m pytest -q

  android:
    name: Android tests and debug build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x android/gradlew
      - run: ./android/gradlew --no-daemon -p android testDemoDebugUnitTest testProductionDebugUnitTest assembleDemoDebug
      - name: Confirm production release refuses missing provisioning
        shell: bash
        run: |
          if ./android/gradlew --no-daemon -p android assembleProductionRelease > /tmp/production-release.log 2>&1; then
            echo "Production release unexpectedly built without provisioning" >&2
            exit 1
          fi
          grep -q "Production release requires" /tmp/production-release.log
          if find android/app/build/outputs/apk/production/release -type f -name '*.apk' 2>/dev/null | grep -q .; then
            echo "A production APK exists after the rejected release task" >&2
            exit 1
          fi

  dashboard:
    name: Dashboard browser checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -c "import re,pathlib; s=pathlib.Path('server/static/index.html').read_text(); m=re.findall(r'<script>(.*?)</script>',s,re.S); assert m, 'inline script missing'; pathlib.Path('/tmp/dashboard.js').write_text(chr(10).join(m))"
      - run: node --check /tmp/dashboard.js
      - run: python -m pip install -r server/requirements.txt -r tests/e2e/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/e2e/dashboard_browser.py
